[package]
name = "fav_bili"
version = "1.3.0"
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
documentation.workspace = true
description = "Back up your favorite bilibili online resources with CLI."
keywords = ["bilibili", "bili"]

[[bin]]
name = "fav"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "process",
    "time",
    "fs",
    "sync",
    "io-util",
    "net",
] }
tokio-util = { version = "0.7" }
futures = { version = "0.3" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = { version = "1.0" }
const_format = { version = "0.2", features = ["fmt"] }
clap = { version = "4.5", features = ["cargo", "derive"] }
clap_complete = { version = "4.5" }
reqwest = { version = "0.13", default-features = false, features = [
    "cookies",
    "json",
    "form",
    "query",
    "rustls",
] }
url = { version = "2.5", features = ["serde"] }
cookie = { version = "0.18" }
percent-encoding = { version = "2.3" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
toml = { version = "1.2" }
console = { version = "0.16" }
qrcode = { version = "0.15", default-features = false }
indicatif = { version = "0.18" }
unicode-width = { version = "0.2" }
md5 = { version = "0.8" }
hmac = { version = "0.13" }
sha2 = { version = "0.11" }
hex = { version = "0.4" }
sea-orm = { version = "2.0", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio",
    "macros",
] }
sea-orm-migration = { version = "2.0", default-features = false, features = [
    "runtime-tokio",
    "sqlx-sqlite",
] }
sanitize-filename = { version = "0.6" }

[dev-dependencies]
tempfile = { version = "3.27" }

[build-dependencies]
anyhow = "1.0"
vergen = { version = "10.0", features = ["build", "rustc"] }
vergen-git2 = "10.0"
