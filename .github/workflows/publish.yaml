name: publish

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      fav_bili:
        description: "publish fav_bili"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install runtime ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test fav_bili before publish
        if: ${{ inputs.fav_bili }}
        run: .github/scripts/publish_test.sh fav_bili

      - name: Publish fav_bili
        if: ${{ inputs.fav_bili }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATESIO }}
        run: .github/scripts/publish.sh fav_bili
