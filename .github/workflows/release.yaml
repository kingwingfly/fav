name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - v[0-9]+.*

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches fav_bili/Cargo.toml version
        run: |
          python3 - <<'PY'
          import os
          import sys
          import tomllib

          with open("fav_bili/Cargo.toml", "rb") as f:
              pkg_version = tomllib.load(f)["package"]["version"]
          if isinstance(pkg_version, dict) and pkg_version.get("workspace"):
              with open("Cargo.toml", "rb") as f:
                  pkg_version = tomllib.load(f)["workspace"]["package"]["version"]

          expected = f"v{pkg_version}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              sys.exit(
                  f"Tag mismatch: GITHUB_REF_NAME={actual!r} != expected {expected!r} "
                  f"(from fav_bili/Cargo.toml)"
              )
          print(f"Verified tag {actual} matches fav_bili/Cargo.toml version {pkg_version}")
          PY

      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: fav
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          tar: unix
          zip: windows
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    needs: [create-release, upload-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --repo "$REPO" --dir dist --pattern '*.tar.gz' --pattern '*.zip'
          (
            cd dist
            shopt -s nullglob
            files=(*.tar.gz *.zip)
            if [[ ${#files[@]} -eq 0 ]]; then
              echo "No release archives downloaded for $TAG" >&2
              exit 1
            fi
            LC_ALL=C sha256sum -- "${files[@]}" > SHA256SUMS
          )
          cat dist/SHA256SUMS
          gh release upload "$TAG" dist/SHA256SUMS --repo "$REPO" --clobber
